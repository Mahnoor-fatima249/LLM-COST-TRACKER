services:
  - type: web
    name: llm-cost-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./llm_cost_tracker.db
      - key: DISABLE_BILLING
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /api/health
    autoDeploy: true
